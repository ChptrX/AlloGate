[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allogate"
version = "0.1.0a2"
description = "Multiscale geometric learning and auditable gate interventions for molecular dynamics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/ChptrX/AlloGate"
Repository = "https://github.com/ChptrX/AlloGate"
Issues = "https://github.com/ChptrX/AlloGate/issues"

[project.optional-dependencies]
evaluation = ["torch>=2.2"]
gnn = ["torch>=2.2"]
test = ["pytest>=8", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
