name: package-smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[evaluation]"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/public_content_audit.py
      - run: python tools/public_content_audit.py --archive dist/*.whl --archive dist/*.tar.gz
      - name: Smoke-test wheel in a clean code environment
        run: |
          python -m venv --system-site-packages "${{ runner.temp }}/allogate-wheel"
          "${{ runner.temp }}/allogate-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "${{ runner.temp }}/allogate-wheel/bin/python" -c "import allogate, allogate.data, allogate.artifacts"
          "${{ runner.temp }}/allogate-wheel/bin/python" examples/synthetic_gate_audit.py --artifact-root "${{ runner.temp }}/wheel-output"
      - name: Smoke-test sdist in a clean code environment
        run: |
          python -m venv --system-site-packages "${{ runner.temp }}/allogate-sdist"
          "${{ runner.temp }}/allogate-sdist/bin/python" -m pip install --no-deps --no-build-isolation dist/*.tar.gz
          "${{ runner.temp }}/allogate-sdist/bin/python" -c "import allogate, allogate.data, allogate.artifacts"
          "${{ runner.temp }}/allogate-sdist/bin/python" examples/synthetic_gate_audit.py --artifact-root "${{ runner.temp }}/sdist-output"
